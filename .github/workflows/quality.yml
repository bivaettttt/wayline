name: Quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt pytest==9.2.0 ruff==0.17.5
      - run: |
          ruff check backend provider scripts tests
          ruff format --check backend provider scripts tests
          pytest -q
          PYTHONPATH=.:backend python scripts/contracts.py
      - working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run format && npm run build
      - run: scripts/lab up
      - working-directory: frontend
        run: npx playwright install --with-deps chromium && npm run e2e
      - run: docker compose -p wayline-lab exec -T api python -u - < scripts/verify.py
      - if: failure()
        run: docker compose -p wayline-lab logs --no-color
      - if: always()
        run: scripts/lab stop
